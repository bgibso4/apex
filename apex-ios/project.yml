name: Apex
options:
  bundleIdPrefix: com.cadre
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.1"
  createIntermediateGroups: true

# DEVELOPMENT_TEAM and APP_BUNDLE_ID come from Signing.xcconfig (which optionally includes a
# gitignored Signing.local.xcconfig). Never set them in `settings` below: target settings
# outrank an xcconfig and would silently defeat the override.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1

packages:
  ApexKit:
    path: Packages/ApexKit

targets:
  Apex:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: ApexKit
        product: Core
      - package: ApexKit
        product: ScreenModels
      - package: ApexKit
        product: Screens
      - package: ApexKit
        product: TestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Apex
        # No Info.plist file until a key needs one.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: APEX
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPhone only, portrait only, dark only.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  # The journeys: the real app, driven from outside its process.
  ApexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Apex
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Apex
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

# Empty aggregate: a scheme needs one build target from this project, and Fast must not
# build the app. The package tests it runs come from the scheme's test targets.
aggregateTargets:
  FastTests:
    targets: []

# Hand-written schemes; XcodeGen's auto-generated ones are off so these are the only ones.
schemes:
  Apex:
    build:
      targets:
        Apex: all
    run:
      config: Debug
    test:
      config: Debug
      # Every simulator test: what `make gate` runs. Package tests run on the Mac, in Fast.
      targets:
        - name: ApexUITests

  # Mac-only loop: no app target, no simulator. Every package test target but ScreensTests is listed here;
  # `make fast` fails when one is missing (check-fast-scheme).
  Fast:
    build:
      targets:
        FastTests: [test]
    test:
      config: Debug
      targets:
        - package: ApexKit/CoreTests
        - package: ApexKit/ScreenModelsTests
        - package: ApexKit/TestSupportTests
