# swift-format owns formatting; SwiftLint owns everything else. Rules both tools share are
# disabled here so they never fight.
excluded:
  - "**/Generated/**"
  - "**/.build"
  - scripts/lint-fixtures
  - scripts/lint-negatives

opt_in_rules:
  - array_init
  - closure_end_indentation
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - lower_acl_than_parent
  - multiline_arguments
  - multiline_parameters
  - overridden_super_call
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition
  - blanket_disable_command

disabled_rules:
  - trailing_comma
  - opening_brace
  - line_length
  - vertical_whitespace
  - indentation_width
  - closure_spacing
  - function_name_whitespace
  - comma
  - colon
  - statement_position
  - trailing_whitespace

custom_rules:
  no_print:
    name: "No print()"
    regex: '(?<!\.)\bprint\('
    match_kinds:
      - identifier
    message: "Use os.Logger (subsystem com.cadre.apex, category = module), never print()."
    severity: error

  try_optional_needs_reason:
    name: "try? needs a reason"
    regex: '(?<!//[^\n]{0,300}\n)^(?![^\n]*//)[^\n]*\btry\?'
    message: "Explain why try? is safe with a comment on the same or previous line."
    severity: error

  no_shared_in_package:
    name: "No singletons in packages"
    regex: '\b[A-Z]\w*\.shared\b'
    included: 'Packages/'
    message: "Inject collaborators; do not reach for .shared inside Packages/."
    severity: error

  disable_needs_reason:
    name: "swiftlint:disable needs a reason"
    regex: 'swiftlint:disable[:a-z]*[ \t]+(?:(?![ \t]-[ \t])[^\n])+$'
    message: "Add a reason after ' - ', e.g. // swiftlint:disable:next force_cast - reason."
    severity: error

  # Every module but Screens, listed or not: a new module is Mac-buildable by default.
  no_ui_imports_in_mac_modules:
    name: "No UI imports in Mac-buildable modules"
    # Any spelling: attributes (@preconcurrency, @testable), an access level, one symbol (import struct …), indented.
    regex: '^[ \t]*(@\w+(\([^)\n]*\))?[ \t]+)*((public|package|internal|fileprivate|private)[ \t]+)?import[ \t]+((struct|class|enum|protocol|typealias|func|let|var)[ \t]+)?(SwiftUI|UIKit)\b'
    included: 'Packages/ApexKit/(Sources|Tests)/'
    excluded: 'Packages/ApexKit/(Sources/Screens|Tests/ScreensTests)/'
    message: "Only Screens may import SwiftUI or UIKit: every other module builds for macOS so its tests run in make fast."
    severity: error

  # The three rules below hold views to the generated tokens (design/tokens.json). They apply to Screens and
  # leave out its DesignSystem folder, where the tokens and the components built on them live.
  no_raw_color:
    name: "No raw colours"
    # A Color built or named in place (Color.clear is no colour), or a system colour passed by its short name.
    regex: '(?<!Tokens\.)\bColor(\(|\.(?!clear\b)\w)|[(\[,:]\s*\.(black|white|gray|red|orange|yellow|green|mint|teal|cyan|blue|indigo|purple|pink|brown|primary|secondary|tertiary|quaternary)\b'
    included: &screens 'Packages/ApexKit/Sources/Screens/'
    excluded: &design_system 'Packages/ApexKit/Sources/Screens/DesignSystem/'
    excluded_match_kinds: &prose [comment, doccomment, string]
    message: "Colours come from Tokens.Color (design/tokens.json), never a raw value."
    severity: error

  no_raw_font:
    name: "No raw fonts"
    # A Font built or named in place, or a text style passed by its short name.
    regex: '\bFont[.(]|\.font\(\s*\.'
    included: *screens
    excluded: *design_system
    excluded_match_kinds: *prose
    message: "Type comes from Tokens.Typography (design/tokens.json)."
    severity: error

  no_raw_animation:
    name: "No raw animations"
    # withAnimation and .animation take a Tokens.Motion value: no other argument, and never the default.
    regex: '(\bwithAnimation|\.animation)\s*(\((?!\s*Tokens\.Motion\.)|\{)'
    included: *screens
    excluded: *design_system
    excluded_match_kinds: *prose
    message: "Animate only with Tokens.Motion (design/tokens.json)."
    severity: error
